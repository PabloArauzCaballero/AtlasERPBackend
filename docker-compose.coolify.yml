# Despliegue del ERP gestionado por COOLIFY.
#
# Va aparte de `docker-compose.dev.yml` —el del VPS operado a mano, con los `.env` en
# `/opt/atlas/env`— porque las dos formas de configurar son incompatibles.
#
# ## La configuración NO se declara aquí
#
# Coolify añade `env_file: - .env` a CADA servicio por su cuenta, con las variables de
# **Application → Environment Variables** dentro. Eso evita el error que tumbó el despliegue de
# AtlasBackend: declarando las claves una a una como `${VAR:-}`, una que no pongas llega VACÍA, y
# hay campos que rechazan la cadena vacía aunque acepten la ausencia. Con el `.env` de Coolify, lo
# que no está simplemente no está.
#
# Pega `atlas-vps-testing/env/erp.env` en Environment Variables, EN BLOQUE.
#
# ## Lo que este archivo NO trae
#
# **La red externa `atlas_vps` ni puertos del host.** Los bloques se encuentran por la red
# compartida `coolify` con un alias estable; ver la nota del final del archivo.
#
# ## Lo que hay que tener resuelto ANTES de desplegar
#
# **El DNS del demonio de Docker.** En Ubuntu `/etc/resolv.conf` apunta a `127.0.0.53`, que dentro
# de un contenedor es el propio contenedor: `apt-get` y `yarn` fallan sin decir por qué, y el log
# de Coolify sólo publica el código de salida. Se arregla con `"dns": ["1.1.1.1","8.8.8.8"]` en
# `/etc/docker/daemon.json` —FUSIONÁNDOLO, no sobrescribiéndolo— y se comprueba con
# `docker run --rm alpine nslookup registry.yarnpkg.com`.
#
# **La base es `atlas_erp` en `atlas-postgres`**, el PostgreSQL propio del host, no un servicio
# gestionado: se llega por el alias de red, nunca por la IP del host, porque `ufw` sólo abre
# 22/80/443 y un paquete a la IP se descarta en vez de fallar.

name: atlas-erp

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# La imagen se construye UNA VEZ, y sólo `migrate` la declara.
#
# `migrate` y `api` son el mismo artefacto y apuntan al mismo tag. Si los dos llevaran `build:`,
# Compose lanzaría dos construcciones CONCURRENTES de la misma imagen y en un VPS eso compite por
# memoria: en AtlasBackend, con tres, el OOM se llevaba una distinta en cada intento y el síntoma
# —`yarn install ... exit code: 1`— no mencionaba la memoria por ninguna parte.
#
# `pull_policy: never` en quien REUTILIZA la imagen, y ninguna en quien la construye. Coolify 4.3.19
# ejecuta `docker compose pull --ignore-buildable` antes del corte: salta a `migrate` (tiene
# `build:`) pero toma a `api` por imagen de registro, y `atlas-erp-backend:coolify` es un tag LOCAL.
# Sin la política, el pull termina en `pull access denied` y ABORTA el despliegue dejando el
# contenedor anterior sirviendo — el despliegue «falla» y nada se cae, así que nadie lo nota hasta
# que un cambio no aparece. Comprobado el 2026-09-13 en el host con un compose de prueba que repite
# esa secuencia. No se usa `build` en su lugar: obliga a `up -d` a reconstruir la imagen DESPUÉS de
# parar el contenedor viejo (33 s de caída medidos en AtlasBackend).
x-image: &image
  image: atlas-erp-backend:coolify
  pull_policy: never

x-build: &build
  image: atlas-erp-backend:coolify
  build:
    context: .
    dockerfile: Dockerfile.dev
    # La caché de build la guarda el DEMONIO, y Coolify la borra cada noche.
    #
    # Aquí había un `cache_from: ['<imagen>:coolify']` que fallaba SIEMPRE —`pull access denied`, en
    # esta máquina no hay registro—. Quitarlo no devuelve caché: sólo deja de fallar y de ensuciar el
    # log. Se retira porque era ruido, no porque estuviera dando algo.
    #
    # Y no se sustituye por `cache_to: type=local`, aunque el driver lo soporte: **el exportador local
    # es del lado del CLIENTE**, y Coolify construye dentro de un contenedor efímero (`docker run
    # --rm`, que sólo monta el socket). Medido: la caché aterriza DENTRO de ese contenedor y se va con
    # él. Sería trabajo por nada.
    #
    # La caché que de verdad se usa es la del propio buildkit del demonio, automática y sin declarar
    # nada. Lo que la tira es `docker builder prune -af` que Coolify ejecuta A DIARIO cuando el
    # servidor tiene `force_docker_cleanup` activo — con esa bandera no mira el umbral de disco, borra
    # igual. Medido el 2026-09-07: los builds de después de la limpieza tardaban 19-27 min y uno murió
    # con `ESOCKETTIMEDOUT` bajando una dependencia; los del mismo día con la caché ya caliente,
    # 1-5 min.
    #
    # Es decir: esto se arregla en el SERVIDOR (Settings -> Docker Cleanup -> desactivar el forzado,
    # dejando el umbral del 80%), no en este archivo.

services:
  # Job de UN SOLO DISPARO: migra y, si hay origen configurado, siembra.
  #
  # El `if` NO es cosmético. `seed-pull.js pull` pide el origen de semillas antes de mirar
  # `--if-empty`, así que sin `SEED_SOURCE_*` lanza «No hay origen de semillas configurado», el
  # contenedor sale con código distinto de cero y `api` NO ARRANCA NUNCA —espera a
  # `service_completed_successfully`—. Lo que se ve entonces es todo EXITED y ningún error que
  # hable de semillas. Pasó exactamente así en AtlasBackend.
  #
  # Con el `if`, «este despliegue no siembra» —legítimo— deja de confundirse con «la siembra
  # falló», que sí debe parar el despliegue.
  migrate:
    <<: *build
    init: true
    command:
      - sh
      - -c
      - >
        npm run db:migrate:prod &&
        if [ -n "$${SEED_SOURCE_DATABASE_URL}$${SEED_SOURCE_HOST}" ]; then
        node dist/scripts/db/seed-pull.js pull --if-empty;
        else echo 'sin SEED_SOURCE_*: se migra pero no se siembra'; fi
    restart: 'no'

  api:
    # Alias ESTABLE en la red compartida: es como lo encuentran los otros bloques.
    # El nombre del contenedor lleva una marca de tiempo y cambia en cada despliegue;
    # este alias no.
    networks:
      default: {}
      coolify:
        aliases: ['erp']
    <<: [*common, *image]
    # `init: true` sustituye al `tini` que iba como ENTRYPOINT: ahora es un paquete opcional —el
    # espejo de Debian puede no responder— y apuntar a un binario que quizá no está deja el
    # contenedor sin arrancar. Docker trae su propio init y hace lo mismo: repartir SIGTERM para
    # que el apagado ordenado corra.
    init: true
    expose: ['3007']
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

# ---------------------------------------------------------------------------------------------
# La red COMPARTIDA de Coolify, y por qué no se publican puertos del host.
#
# Coolify nombra cada contenedor con una MARCA DE TIEMPO —`api-<uuid>-124239539875`—, así que en
# cada despliegue crea uno NUEVO en vez de reemplazar el anterior. Con un puerto fijo del host eso
# choca siempre: el contenedor viejo sigue sujetando el puerto y el nuevo muere con
# `failed to bind host port ...: address already in use`. No es un puerto mal elegido: es que
# publicar un puerto fijo es incompatible con cómo despliega Coolify.
#
# La salida es la red compartida `coolify`, a la que se unen todas las aplicaciones, con un ALIAS
# estable por servicio. El alias no cambia entre despliegues —el nombre del contenedor sí— así que
# los bloques se encuentran por nombre igual que hacían en el VPS operado a mano, y sin abrir un
# solo puerto en el host.
#
# **Hace falta activar «Connect To Predefined Network» en esta aplicación dentro de Coolify.** Sin
# eso la red no existe para ella y el despliegue falla diciendo que no la encuentra, que es un
# fallo claro y no silencioso.
networks:
  default: {}
  coolify:
    external: true
    name: coolify
